<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hitung Gaji</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginScreen" class="card">
    <h1>Login</h1>
    <form id="formLogin">
      <label>Username</label>
      <input type="text" id="username" placeholder="Username" required>
      <label>Password</label>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Masuk</button>
    </form>
    <p class="link-text">Belum punya akun? <a href="#" id="toDaftar">Daftar</a></p>
    <div id="loginError" class="error" style="display:none;">Username atau password salah</div>
  </div>

  <div id="daftarScreen" class="card" style="display:none;">
    <h1>Daftar</h1>
    <form id="formDaftar">
      <label>Username</label>
      <input type="text" id="daftarUsername" placeholder="Username" required>
      <label>Password</label>
      <input type="password" id="daftarPassword" placeholder="Password" required>
      <button type="submit">Daftar</button>
    </form>
    <p class="link-text">Sudah punya akun? <a href="#" id="toLogin">Login</a></p>
    <div id="daftarError" class="error" style="display:none;">Username sudah terdaftar</div>
    <div id="daftarSukses" class="sukses" style="display:none;">Berhasil daftar, silakan login</div>
  </div>

  <div id="appScreen" class="card" style="display:none;">
    <h1>Hitung Gaji</h1>
    <form id="formGaji">
      <label>Jam Kerja</label>
      <input type="number" id="jamKerja" placeholder="Masukkan jam kerja" required>
      <label>Tarif per Jam (Rp)</label>
      <input type="number" id="tarifJam" placeholder="Tarif per jam" required>
      <label>Gaji per Hari (Rp)</label>
      <input type="number" id="gajiHari" placeholder="Gaji jika kerja ≥ 9 jam" required>
      <button type="submit">Hitung</button>
    </form>
    <div id="hasil" class="hasil" style="display:none;"></div>
    <button id="logoutBtn" class="logout">Logout</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
